name: Deploy to EC2

on:
  workflow_run:
    workflows: ["Build & Push Images"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/secure-media-vault"

      # Step 1: Pull images (can be slow on first run - allow 20 min)
      - name: Pull latest images on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          connect_timeout: 30s
          command_timeout: 20m
          script: |
            set -e
            cd /opt/secure-media-vault

            # Verify .env file exists
            if [ ! -f .env ]; then
              echo "ERROR: .env file not found at /opt/secure-media-vault/.env"
              echo "Create it from .env.example and configure your secrets."
              exit 1
            fi

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} \
              --password-stdin

            echo "==> Pulling latest images..."
            docker compose pull
            echo "==> Pull complete."

      # Step 2: Start containers (separate timeout so pull time doesn't count)
      - name: Start containers on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          connect_timeout: 30s
          command_timeout: 10m
          script: |
            set -e
            cd /opt/secure-media-vault

            echo "==> Starting containers..."
            docker compose up -d --remove-orphans

            # Wait a few seconds then verify all services are healthy
            sleep 10
            docker compose ps

            # Clean up old dangling images
            docker image prune -f

            echo "==> Deployment completed successfully!"

